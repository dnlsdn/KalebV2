<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif">
<title>Servo rail before and after session 6: through the relay, then through a WAGO with the relay removed</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="30" y="36" font-size="13" fill="#888780" font-weight="bold">Session 5: through the relay</text>
<rect x="30" y="50" width="150" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="105" y="71" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">SZBK07 OUT+</text>
<text x="105" y="89" font-size="11" fill="#0C447C" text-anchor="middle">6V</text>
<rect x="260" y="50" width="160" height="50" rx="6" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
<text x="340" y="71" font-size="13" fill="#791F1F" text-anchor="middle" font-weight="bold">Relay</text>
<text x="340" y="89" font-size="11" fill="#791F1F" text-anchor="middle">COM → NO</text>
<rect x="500" y="50" width="150" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="575" y="71" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">PCA9685 V+</text>
<text x="575" y="89" font-size="11" fill="#0C447C" text-anchor="middle">servo rail</text>
<line x1="180" y1="75" x2="258" y2="75" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="75" x2="498" y2="75" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="100" x2="340" y2="118" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="340" y="134" font-size="11" fill="#888780" text-anchor="middle">IN from GPIO27: no ESP32 pin can turn it off</text>
<text x="30" y="186" font-size="13" fill="#888780" font-weight="bold">Session 6: relay removed</text>
<rect x="30" y="200" width="150" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="105" y="221" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">SZBK07 OUT+</text>
<text x="105" y="239" font-size="11" fill="#0C447C" text-anchor="middle">6V</text>
<rect x="260" y="200" width="160" height="50" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="340" y="221" font-size="13" fill="#633806" text-anchor="middle" font-weight="bold">WAGO 221-412</text>
<text x="340" y="239" font-size="11" fill="#633806" text-anchor="middle">AWG14 joined to AWG16</text>
<rect x="500" y="200" width="150" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="575" y="221" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">PCA9685 V+</text>
<text x="575" y="239" font-size="11" fill="#0C447C" text-anchor="middle">servo rail</text>
<line x1="180" y1="225" x2="258" y2="225" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="225" x2="498" y2="225" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="282" font-size="11" fill="#888780" text-anchor="middle">the rail is live whenever the XT60 is connected, as in Leika: the connector is the switch</text>
</svg>
