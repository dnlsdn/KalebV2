<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif">
<title>Relay module IN voltage: the relay is off only above about 4.2V, and every ESP32 pin state is below it</title>
<line x1="72" y1="60" x2="72" y2="300" stroke="#888780" stroke-width="1"/>
<g font-size="11" fill="#888780" text-anchor="end">
<text x="64" y="304">0V</text><text x="64" y="256">1V</text><text x="64" y="208">2V</text>
<text x="64" y="160">3V</text><text x="64" y="112">4V</text><text x="64" y="64">5V</text>
</g>
<g stroke="#888780" stroke-width="1">
<line x1="68" y1="300" x2="72" y2="300"/><line x1="68" y1="252" x2="72" y2="252"/><line x1="68" y1="204" x2="72" y2="204"/>
<line x1="68" y1="156" x2="72" y2="156"/><line x1="68" y1="108" x2="72" y2="108"/><line x1="68" y1="60" x2="72" y2="60"/>
</g>
<rect x="80" y="60" width="150" height="38.4" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="155" y="84" font-size="13" fill="#27500A" text-anchor="middle" font-weight="bold">relay off</text>
<rect x="80" y="98.4" width="150" height="201.6" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
<text x="155" y="225" font-size="13" fill="#791F1F" text-anchor="middle" font-weight="bold">relay on</text>
<text x="155" y="243" font-size="11" fill="#791F1F" text-anchor="middle">servo rail live</text>
<line x1="230" y1="63.4" x2="260" y2="63.4" stroke="#5F5E5A" stroke-width="1.5"/>
<circle cx="230" cy="63.4" r="3" fill="#5F5E5A"/>
<text x="268" y="67" font-size="12" fill="#888780">module VCC, 4.93V</text>
<line x1="230" y1="98.4" x2="660" y2="98.4" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="268" y="92" font-size="12" fill="#888780" font-weight="bold">≈ 4.2V threshold: VCC minus one base-emitter drop</text>
<line x1="230" y1="112.8" x2="260" y2="112.8" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="230" cy="112.8" r="3" fill="#185FA5"/>
<text x="268" y="117" font-size="12" fill="#888780">ESP32 pin in high impedance: clamped near 3.9V</text>
<line x1="230" y1="151.2" x2="260" y2="151.2" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="230" cy="151.2" r="3" fill="#185FA5"/>
<text x="268" y="155" font-size="12" fill="#888780">ESP32 pin driven high: 3.1V measured, 3.3V nominal</text>
<text x="268" y="224" font-size="12" fill="#888780">every state an ESP32 pin can reach is below the line,</text>
<text x="268" y="242" font-size="12" fill="#888780">so with GPIO27 wired straight to IN no software</text>
<text x="268" y="260" font-size="12" fill="#888780">can ever hold this relay off</text>
</svg>
