<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Helvetica, Arial, sans-serif">
<title>Why the bus bars came out, and what replaced them</title>
<text x="140" y="24" font-size="14" fill="#5F5E5A" font-weight="bold" text-anchor="middle">The plate, to scale</text>
<rect x="34" y="40" width="212" height="300" rx="6" fill="none" stroke="#888780" stroke-width="1.5"/>
<rect x="46" y="55" width="56" height="270" rx="8" fill="#F09595" stroke="#A32D2D"/>
<rect x="110" y="55" width="56" height="270" rx="8" fill="#B4B2A9" stroke="#5F5E5A"/>
<rect x="174" y="55" width="60" height="270" rx="4" fill="none" stroke="#1D9E75" stroke-dasharray="4 3"/>
<text x="74" y="194" font-size="11" fill="#791F1F" text-anchor="middle">red</text>
<text x="138" y="194" font-size="11" fill="#2C2C2A" text-anchor="middle">black</text>
<text x="204" y="186" font-size="11" fill="#085041" text-anchor="middle">all the</text>
<text x="204" y="200" font-size="11" fill="#085041" text-anchor="middle">rest?</text>
<text x="140" y="360" font-size="11" fill="#888780" text-anchor="middle">plate 106 × 150 mm · each bar 150 × 28 mm</text>
<text x="470" y="24" font-size="14" fill="#5F5E5A" font-weight="bold" text-anchor="middle">What replaced them</text>
<g font-size="12">
<rect x="290" y="40" width="360" height="62" rx="6" fill="#D3D1C7" stroke="#5F5E5A"/>
<text x="304" y="62" fill="#2C2C2A" font-weight="bold">Ground: WAGO A → B → C</text>
<text x="304" y="82" fill="#444441">A: battery −, SZBK07 IN−, PCA9685 GND (heavy)</text>
<text x="304" y="96" fill="#444441">B, C: step-down, ESP32, IMU, ACS712, HC-SR04 ×2</text>
<rect x="290" y="114" width="360" height="48" rx="6" fill="#F7C1C1" stroke="#A32D2D"/>
<text x="304" y="136" fill="#791F1F" font-weight="bold">5V: WAGO D</text>
<text x="304" y="152" fill="#791F1F">step-down OUT+, ESP32 VIN, ACS712, HC-SR04 ×2</text>
<rect x="290" y="174" width="360" height="62" rx="6" fill="#9FE1CB" stroke="#0F6E56"/>
<text x="304" y="196" fill="#04342C" font-weight="bold">3.3V and I2C: the PCA9685's two headers</text>
<text x="304" y="216" fill="#085041">joined pin for pin on the board: ESP32 on one,</text>
<text x="304" y="230" fill="#085041">IMU on the other, OE jumpered to GND</text>
</g>
<text x="290" y="268" font-size="12" fill="#888780">Same circuit, node for node. Nothing bought:</text>
<text x="290" y="286" font-size="12" fill="#888780">two spare WAGOs plus the three the I2C freed.</text>
<text x="290" y="316" font-size="12" fill="#888780">Found on the way: neither step-down has an</text>
<text x="290" y="334" font-size="12" fill="#888780">OUT− wire, though the docs said so since July.</text>
</svg>
