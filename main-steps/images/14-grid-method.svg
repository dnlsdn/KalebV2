<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Helvetica, Arial, sans-serif">
<title>Measuring 90 degrees with the grid of a squared sheet</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g stroke="#888780" stroke-width="0.6" opacity="0.6"><line x1="70" y1="50" x2="70" y2="290"/><line x1="100" y1="50" x2="100" y2="290"/><line x1="130" y1="50" x2="130" y2="290"/><line x1="160" y1="50" x2="160" y2="290"/><line x1="190" y1="50" x2="190" y2="290"/><line x1="220" y1="50" x2="220" y2="290"/><line x1="250" y1="50" x2="250" y2="290"/><line x1="280" y1="50" x2="280" y2="290"/><line x1="310" y1="50" x2="310" y2="290"/><line x1="70" y1="50" x2="310" y2="50"/><line x1="70" y1="80" x2="310" y2="80"/><line x1="70" y1="110" x2="310" y2="110"/><line x1="70" y1="140" x2="310" y2="140"/><line x1="70" y1="170" x2="310" y2="170"/><line x1="70" y1="200" x2="310" y2="200"/><line x1="70" y1="230" x2="310" y2="230"/><line x1="70" y1="260" x2="310" y2="260"/><line x1="70" y1="290" x2="310" y2="290"/><line x1="370" y1="50" x2="370" y2="290"/><line x1="400" y1="50" x2="400" y2="290"/><line x1="430" y1="50" x2="430" y2="290"/><line x1="460" y1="50" x2="460" y2="290"/><line x1="490" y1="50" x2="490" y2="290"/><line x1="520" y1="50" x2="520" y2="290"/><line x1="550" y1="50" x2="550" y2="290"/><line x1="580" y1="50" x2="580" y2="290"/><line x1="610" y1="50" x2="610" y2="290"/><line x1="370" y1="50" x2="610" y2="50"/><line x1="370" y1="80" x2="610" y2="80"/><line x1="370" y1="110" x2="610" y2="110"/><line x1="370" y1="140" x2="610" y2="140"/><line x1="370" y1="170" x2="610" y2="170"/><line x1="370" y1="200" x2="610" y2="200"/><line x1="370" y1="230" x2="610" y2="230"/><line x1="370" y1="260" x2="610" y2="260"/><line x1="370" y1="290" x2="610" y2="290"/></g>
<rect x="150" y="150" width="80" height="120" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
<rect x="450" y="150" width="80" height="120" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
<line x1="190" y1="170" x2="190" y2="75" stroke="#378ADD" stroke-width="10" stroke-linecap="round"/>
<circle cx="190" cy="170" r="7" fill="#185FA5"/>
<line x1="490" y1="170" x2="490" y2="75" stroke="#378ADD" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.4"/>
<line x1="490" y1="170" x2="585" y2="170" stroke="#378ADD" stroke-width="10" stroke-linecap="round"/>
<circle cx="490" cy="170" r="7" fill="#185FA5"/>
<path d="M490 120 A50 50 0 0 1 540 170" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>
<text x="532" y="128" font-size="14" fill="#BA7517">90°</text>
<text x="190" y="318" font-size="14" fill="#888780" text-anchor="middle" font-weight="bold">slider = a</text>
<text x="190" y="338" font-size="12" fill="#888780" text-anchor="middle">horn arm on a grid line</text>
<text x="490" y="318" font-size="14" fill="#888780" text-anchor="middle" font-weight="bold">slider = b</text>
<text x="490" y="338" font-size="12" fill="#888780" text-anchor="middle">horn arm on the perpendicular line</text>
<text x="340" y="366" font-size="13" fill="#888780" text-anchor="middle">conversion = |a − b| / 90 ticks per degree</text>
</svg>
