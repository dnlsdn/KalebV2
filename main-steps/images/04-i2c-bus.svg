<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Helvetica, Arial, sans-serif">
<title>I2C bus: ESP32 3V3, SDA and SCL split by three WAGOs to the PCA9685 and the MPU6050</title>
<rect x="30" y="100" width="150" height="190" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="105" y="124" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="bold">ESP32</text>
<text x="170" y="154" font-size="12" fill="#2C2C2A" text-anchor="end">3V3</text>
<text x="170" y="204" font-size="12" fill="#2C2C2A" text-anchor="end">GPIO21 · SDA</text>
<text x="170" y="254" font-size="12" fill="#2C2C2A" text-anchor="end">GPIO22 · SCL</text>
<rect x="290" y="133" width="90" height="34" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="335" y="155" font-size="12" fill="#633806" text-anchor="middle">WAGO 3V3</text>
<rect x="290" y="183" width="90" height="34" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="335" y="205" font-size="12" fill="#633806" text-anchor="middle">WAGO SDA</text>
<rect x="290" y="233" width="90" height="34" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="335" y="255" font-size="12" fill="#633806" text-anchor="middle">WAGO SCL</text>
<line x1="180" y1="150" x2="290" y2="150" stroke="#A32D2D" stroke-width="2"/>
<line x1="180" y1="200" x2="290" y2="200" stroke="#185FA5" stroke-width="2"/>
<line x1="180" y1="250" x2="290" y2="250" stroke="#3B6D11" stroke-width="2"/>
<line x1="380" y1="150" x2="480" y2="95" stroke="#A32D2D" stroke-width="2"/>
<line x1="380" y1="150" x2="480" y2="235" stroke="#A32D2D" stroke-width="2"/>
<line x1="380" y1="200" x2="480" y2="120" stroke="#185FA5" stroke-width="2"/>
<line x1="380" y1="200" x2="480" y2="255" stroke="#185FA5" stroke-width="2"/>
<line x1="380" y1="250" x2="480" y2="145" stroke="#3B6D11" stroke-width="2"/>
<line x1="380" y1="250" x2="480" y2="275" stroke="#3B6D11" stroke-width="2"/>
<rect x="480" y="55" width="170" height="125" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="490" y="99" font-size="11" fill="#0C447C">VCC</text>
<text x="490" y="124" font-size="11" fill="#0C447C">SDA</text>
<text x="490" y="149" font-size="11" fill="#0C447C">SCL</text>
<text x="595" y="92" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="bold">PCA9685</text>
<text x="595" y="110" font-size="12" fill="#0C447C" text-anchor="middle">0x40</text>
<text x="595" y="138" font-size="11" fill="#0C447C" text-anchor="middle">10k pull-ups</text>
<text x="595" y="153" font-size="11" fill="#0C447C" text-anchor="middle">SDA, SCL → VCC</text>
<rect x="480" y="210" width="170" height="85" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="490" y="239" font-size="11" fill="#0C447C">VCC</text>
<text x="490" y="259" font-size="11" fill="#0C447C">SDA</text>
<text x="490" y="279" font-size="11" fill="#0C447C">SCL</text>
<text x="595" y="252" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="bold">MPU6050</text>
<text x="595" y="270" font-size="12" fill="#0C447C" text-anchor="middle">0x68</text>
<text x="340" y="330" font-size="12" fill="#888780" text-anchor="middle">the pull-ups make the PCA9685's VCC the idle voltage of the whole bus:</text>
<text x="340" y="348" font-size="12" fill="#888780" text-anchor="middle">on the 5V bar both lines would idle 1.4V above the ESP32's 3.6V maximum,</text>
<text x="340" y="366" font-size="12" fill="#888780" text-anchor="middle">on the 3V3 pin they idle at 3.3V and no level shifter is needed</text>
</svg>
