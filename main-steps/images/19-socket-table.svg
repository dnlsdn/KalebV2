<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif">
<title>The socket table before and after session 19</title>
<text x="40" y="34" font-size="14" fill="#5F5E5A" font-weight="bold">Before: 10 sockets</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="46" width="54" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/><text x="67" y="70" fill="#2C2C2A">server</text>
<rect x="98" y="46" width="54" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/><text x="125" y="70" fill="#2C2C2A">server</text>
<rect x="156" y="46" width="54" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/><text x="183" y="70" fill="#2C2C2A">server</text>
<rect x="214" y="46" width="54" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/><text x="241" y="70" fill="#2C2C2A">DNS</text>
<rect x="272" y="46" width="54" height="40" rx="4" fill="#F7C1C1" stroke="#A32D2D"/><text x="299" y="70" fill="#791F1F">dead</text>
<rect x="330" y="46" width="54" height="40" rx="4" fill="#F7C1C1" stroke="#A32D2D"/><text x="357" y="70" fill="#791F1F">dead</text>
<rect x="388" y="46" width="54" height="40" rx="4" fill="#F7C1C1" stroke="#A32D2D"/><text x="415" y="70" fill="#791F1F">dead</text>
<rect x="446" y="46" width="54" height="40" rx="4" fill="#F7C1C1" stroke="#A32D2D"/><text x="473" y="70" fill="#791F1F">dead</text>
<rect x="504" y="46" width="54" height="40" rx="4" fill="#F7C1C1" stroke="#A32D2D"/><text x="531" y="70" fill="#791F1F">dead</text>
<rect x="562" y="46" width="54" height="40" rx="4" fill="#B5D4F4" stroke="#185FA5"/><text x="589" y="70" fill="#0C447C">phone</text>
</g>
<text x="40" y="108" font-size="12" fill="#888780">Each Wi-Fi drop left a socket open and a client Leika kept sending to. Once the 10 were used,</text>
<text x="40" y="124" font-size="12" fill="#888780">every new connection failed with error in accept (23), and the phone could not get back in.</text>
<text x="40" y="168" font-size="14" fill="#5F5E5A" font-weight="bold">After: 16 sockets, dead ones closed</text>
<g font-size="11" text-anchor="middle">
<rect x="40" y="180" width="30" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/>
<rect x="74" y="180" width="30" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/>
<rect x="108" y="180" width="30" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/>
<rect x="142" y="180" width="30" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A"/>
<rect x="176" y="180" width="30" height="40" rx="4" fill="#B5D4F4" stroke="#185FA5"/>
<rect x="210" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="244" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="278" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="312" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="346" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="380" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="414" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="448" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="482" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="516" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
<rect x="550" y="180" width="30" height="40" rx="4" fill="none" stroke="#888780" stroke-dasharray="3 3"/>
</g>
<text x="40" y="242" font-size="12" fill="#888780">Keep-alive notices a phone that vanished and closes its socket; close_fn removes it from the</text>
<text x="40" y="258" font-size="12" fill="#888780">client list. Same test after the fix: 0 accept errors, 0 sends to dead clients, 9 clients removed.</text>
<g font-size="11"><rect x="40" y="272" width="12" height="12" rx="2" fill="#D3D1C7" stroke="#5F5E5A"/><text x="58" y="282" fill="#888780">server, DNS</text>
<rect x="140" y="272" width="12" height="12" rx="2" fill="#B5D4F4" stroke="#185FA5"/><text x="158" y="282" fill="#888780">live phone</text>
<rect x="240" y="272" width="12" height="12" rx="2" fill="#F7C1C1" stroke="#A32D2D"/><text x="258" y="282" fill="#888780">phone gone, socket still open</text>
<rect x="440" y="272" width="12" height="12" rx="2" fill="none" stroke="#888780" stroke-dasharray="3 3"/><text x="458" y="282" fill="#888780">free</text></g>
</svg>
