<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif">
<title>Two tasks sharing one I2C device handle, without and with a lock</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="40" width="190" height="56" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="125" y="64" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="bold">Control task</text>
<text x="125" y="82" font-size="12" fill="#0C447C" text-anchor="middle">every 10ms: IMU 0x68, PCA 0x40</text>
<rect x="30" y="180" width="190" height="56" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="125" y="204" font-size="14" fill="#633806" text-anchor="middle" font-weight="bold">WebSocket handler</text>
<text x="125" y="222" font-size="12" fill="#633806" text-anchor="middle">PWM slider: PCA 0x40 now</text>
<rect x="290" y="110" width="150" height="56" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="365" y="134" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="bold">One device handle</text>
<text x="365" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle">re-made on each address change</text>
<line x1="220" y1="68" x2="288" y2="125" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220" y1="208" x2="288" y2="152" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500" y="60" width="150" height="44" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="575" y="87" font-size="13" fill="#2C2C2A" text-anchor="middle">PCA9685 0x40</text>
<rect x="500" y="172" width="150" height="44" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="575" y="199" font-size="13" fill="#2C2C2A" text-anchor="middle">IMU 0x68</text>
<line x1="440" y1="130" x2="498" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="148" x2="498" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="268" font-size="12" fill="#888780" text-anchor="middle">without a lock, one task deletes the handle while the other is mid-transaction:</text>
<text x="340" y="286" font-size="12" fill="#888780" text-anchor="middle">"Wrong I2C status, cannot delete device" — 21 in 109 slider moves; with a lock, 0 in 812</text>
</svg>
